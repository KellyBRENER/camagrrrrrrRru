<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName localhost
        DocumentRoot /var/www/html/public

        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/camagru-selfsigned.crt
        SSLCertificateKeyFile /etc/ssl/private/camagru-selfsigned.key

        <Directory /var/www/html/public>
            AllowOverride All
            Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
    </VirtualHost>
</IfModule>
